<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaptureSok · Preview</title><link rel="stylesheet" href="../ui/base.css"><link rel="stylesheet" href="result.css"></head><body>
<header><div class="brand"><img src="../icons/48.png" alt=""><div><strong>CaptureSok</strong><small data-i18n="resultTitle"></small></div></div><button id="close" class="ghost" data-i18n="close"></button></header>
<main><section class="workspace"><div class="canvas-bar"><div><strong data-i18n="captureReady"></strong><small id="metadata" class="muted"></small></div><div class="zoom"><button id="zoomOut" data-label="zoomOut">−</button><output id="zoomValue">100%</output><button id="zoomIn" data-label="zoomIn">+</button><button id="fit" data-i18n="fit"></button><button id="actual" data-i18n="actualSize"></button></div></div><div id="viewport"><img id="previewImage" alt="" hidden><p id="loading" class="muted" data-i18n="processing"></p></div></section>
<aside><h2 data-i18n="exportSettings"></h2><label for="format" data-i18n="format"></label><select id="format"><option value="png">PNG</option><option value="jpeg">JPG</option></select><div id="qualityRow"><label for="quality" data-i18n="quality"></label><div class="range"><input type="range" min="50" max="100" value="92" id="quality"><output id="qualityValue">92%</output></div></div><button id="edit" disabled>편집</button><button id="save" class="primary" disabled data-i18n="download"></button><button id="copy" disabled data-i18n="copy"></button><p id="status" class="status" role="status" aria-live="polite"></p><p id="limitation" class="muted"></p><div class="aside-footer"><small data-i18n="localOnly"></small><button id="delete" class="ghost" disabled data-i18n="deleteResult"></button></div></aside></main>
<script type="module" src="result.js"></script></body></html>
